server {
    listen 8080;
    server_name _;

    # Фронтенд (React статика)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Запросы к API вашего основного бэкенда
    # ЗАМЕНИТЕ YOUR_MAIN_VPS_IP на IP вашего основного сервера
    location /api/v1/ {
        proxy_pass http://89.22.225.165:8081/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Запросы к подпискам
    location /sub/ {
        proxy_pass http://89.22.225.165:8081/sub/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
